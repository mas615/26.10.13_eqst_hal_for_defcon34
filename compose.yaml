name: halctf-home

x-challenge-defaults: &challenge-defaults
  restart: "no"
  cpus: 0.50
  mem_limit: 512m
  pids_limit: 256
  network_mode: bridge
  labels:
    halctf.session: "home-20260729"
    halctf.component: "challenge"

services:
  portal:
    build:
      context: ./portal
    image: halctf-portal:home-20260729
    container_name: halctf-home-portal
    restart: "no"
    ports:
      - "0.0.0.0:21080:8080"
    environment:
      PUBLIC_HOST: "localhost"
      ADMIN_IPS: "127.0.0.1"
      RATE_LIMIT_ATTEMPTS: "360"
      DATA_DIR: "/data"
      CHALLENGES_FILE: "/app/config/challenges.json"
      ATTACHMENTS_ROOT: "/app/attachments"
    volumes:
      - halctf-home-portal-data:/data
      - ./challenges.json:/app/config/challenges.json:ro
      - ./attachments:/app/attachments:ro
    cpus: 0.50
    mem_limit: 256m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    labels:
      halctf.session: "home-20260729"
      halctf.component: "portal"

  admin-portal:
    build:
      context: ./portal
    image: halctf-portal:home-20260729
    container_name: halctf-home-admin
    restart: "no"
    depends_on:
      portal:
        condition: service_healthy
    ports:
      - "127.0.0.1:21079:8080"
    environment:
      PUBLIC_HOST: "localhost"
      ADMIN_IPS: "172.20.0.1"
      RATE_LIMIT_ATTEMPTS: "360"
      DATA_DIR: "/data"
      CHALLENGES_FILE: "/app/config/challenges.json"
      ATTACHMENTS_ROOT: "/app/attachments"
    volumes:
      - halctf-home-portal-data:/data
      - ./challenges.json:/app/config/challenges.json:ro
      - ./attachments:/app/attachments:ro
    cpus: 0.25
    mem_limit: 192m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    labels:
      halctf.session: "home-20260729"
      halctf.component: "admin-portal"

  orange:
    <<: *challenge-defaults
    build:
      context: ./deployments/orange
    image: eqsthal-orange:guard-20260730
    container_name: halctf-home-orange
    restart: "on-failure:5"
    ports:
      - "0.0.0.0:21081:9999"

  algebra:
    <<: *challenge-defaults
    image: llmctf/2018q-misc-algebra:latest
    container_name: halctf-home-algebra
    ports:
      - "0.0.0.0:21082:4324"

  bigboi:
